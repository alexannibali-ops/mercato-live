name: Edizione

# Ogni 30 minuti. Nota: il cron di GitHub Actions non è puntuale — nelle ore
# di punta può ritardare di 5-20 minuti, e in rari casi salta un giro.
# Per un giornale di mercato è del tutto accettabile.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:        # bottone "Run workflow" per forzare un'edizione
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/edizione.yml"

permissions:
  contents: write           # serve per il commit di docs/

concurrency:
  group: edizione
  cancel-in-progress: false

jobs:
  comporre:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Raccolta notizie
        run: python src/fetch.py
        continue-on-error: true   # se tutte le fonti cadono, teniamo l'edizione precedente

      - name: Impaginazione
        run: python src/build.py

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name  "redazione-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs build 2>/dev/null || git add -A docs
          if git diff --cached --quiet -- docs/.content-hash; then
            echo "Nessuna notizia nuova: niente commit."
            git reset
            exit 0
          fi
          git commit -m "Edizione delle $(TZ=Europe/Rome date '+%H:%M del %d/%m/%Y')"
          git push
